name: Beta

on:
  workflow_dispatch:
    inputs:
      ide_version:
        description: "IDE version"
        required: false
        type: string
      runtime_version:
        description: "Runtime version"
        required: false
        type: string
  pull_request:
    paths-ignore:
      - '.github/workflows/**'
    branches:
      - develop

env:
 S3_BUCKET: ${{ secrets.S3_BUCKET }}
 ZIP_FILE: ${{ secrets.ZIP_FILE }}
 GITHUB_REPOSITORY: ${{ github.repository }}

jobs:

   RoboHelp:
     name: "RoboHelp"
     runs-on: windows-2022
     env:
       LANGUAGE: ${{ vars.LANGUAGE }}
     steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.REGION }}
      - name: Enable git long paths to bypass path limit on Windows
        run: git config --system core.longpaths true
      - name: Check out the GMS2_Documentation repo
        uses: actions/checkout@v4
        with:
          path: Manual  
          token: ${{ secrets.GH_TOKEN }}                
      - name: Beta Builds
        if: github.event.pull_request.base.ref == 'develop' || github.event_name == 'workflow_dispatch'
        env:
          BUILDBETA: '1'
        run: build_robohelp_gh.bat %GITHUB_WORKSPACE%\output
        shell: cmd
        working-directory: Manual       
      - name: Upload robohelp zip file
        uses: actions/upload-artifact@v4
        with:
           name: YoYoStudioRoboHelp
           path: output\RoboHelp\*.zip
           if-no-files-found: error

   Slack-Notification:
     name: "Slack Notification"
     if: github.event_name == 'workflow_dispatch'
     runs-on: ubuntu-24.04
     needs: RoboHelp
     steps:
      - name: Send Slack Notification Triggered while Nightly Build
        run: |
          set -euo pipefail

          ARTIFACT_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"

          if [[ "${{ job.status }}" == "success" ]]; then
              MSG="📘 English Manual build completed successfully for *Beta Nightly* 
              *Artifacts*: ${ARTIFACT_URL}"
          else
              MSG="⚠️ English Manual build failed for *Beta Nightly* 
              *Check logs*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MSG\"}" \
            "$SLACK_WEBHOOK_URL"

          
