name: Upstream Sync

on:
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync_develop:
    uses: YoYoGames/GameMaker-Manual/.github/workflows/upstream-sync-reusable.yml@develop
    with:
      target_branch: develop
      upstream_branch: develop
      upstream_repo: YoYoGames/GameMaker-Manual
    secrets:
      GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}

  sync_2026_main:
    uses: YoYoGames/GameMaker-Manual/.github/workflows/upstream-sync-reusable.yml@develop
    with:
      target_branch: 2026.0.0-main
      upstream_branch: 2026.0.0-main
      upstream_repo: YoYoGames/GameMaker-Manual
    secrets:
      GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}