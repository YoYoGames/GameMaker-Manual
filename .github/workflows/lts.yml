name: LTS

on:
    workflow_dispatch:
    pull_request:
      branches:
        - 2026.0.0-main
    
env:
     S3_BUCKET: ${{ secrets.S3_BUCKET }}
     ZIP_FILE: ${{ secrets.ZIP_FILE }}
     GITHUB_REPOSITORY: ${{ github.repository }}

permissions:
  contents: read
  id-token: write

jobs:
    
  RoboHelp:
    name: "RoboHelp"
    runs-on: windows-2022
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-session-name: github-actions-s3-upload-${{ github.run_id }}
          role-to-assume: ${{ vars.CORETECH_ASSUME_ROLE_ARN }}
          aws-region: eu-west-1
      - name: Enable git long paths to bypass path limit on Windows
        run: git config --system core.longpaths true
      - name: Check out the GMS2_Documentation repo
        uses: actions/checkout@v6
        with:
          path: Manual  
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      - name: LTS Builds
        run: build_robohelp_gh.bat %GITHUB_WORKSPACE%\output
        shell: cmd
        working-directory: Manual       
      - name: Upload robohelp zip file
        uses: actions/upload-artifact@v7
        with:
          name: YoYoStudioRoboHelp
          path: output\RoboHelp\*.zip
          if-no-files-found: error
    
