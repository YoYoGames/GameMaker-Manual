name: LTS

on:
    workflow_dispatch:
    pull_request:
      branches:
        - 2026.0.0-main
    
env:
     S3_BUCKET: ${{ secrets.S3_BUCKET }}
     ZIP_FILE: ${{ secrets.ZIP_FILE }}
    
jobs:
    
       RoboHelp:
         name: "RoboHelp"
         runs-on: windows-2022
         env:
            LANGUAGE: ${{ vars.LANGUAGE }}
         steps:
          - name: Configure AWS Credentials
            uses: aws-actions/configure-aws-credentials@v6
            with:
              role-session-name: github-actions-s3-upload-${{ github.run_id }}
              role-to-assume: ${{ vars.CORETECH_ASSUME_ROLE_ARN }}
              aws-region: us-east-1  
          - name: Enable git long paths to bypass path limit on Windows
            run: git config --system core.longpaths true
          - name: Check out the GMS2_Documentation repo
            uses: actions/checkout@v6
            with:
              path: Manual  
              token: ${{ secrets.GH_TOKEN }}
          - name: LTS Builds
            run: build_robohelp_gh.bat %GITHUB_WORKSPACE%\output
            shell: cmd
            working-directory: Manual       
          - name: Upload robohelp zip file
            uses: actions/upload-artifact@v7
            with:
               name: YoYoStudioRoboHelp
               path: output\RoboHelp\*.zip
               if-no-files-found: error

       Slack-Notification:
          name: "Slack Notification"
          if: github.event_name == 'workflow_dispatch'
          runs-on: ubuntu-24.04
          needs: RoboHelp
          env:
            SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
            LANGUAGE: ${{ vars.LANGUAGE }}
          steps:
              - name: Send Slack Notification Triggered while Nightly Build
                run: |
                  set -euo pipefail

                  ARTIFACT_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"

                  if [[ "${{ job.status }}" == "success" ]]; then
                      MSG="📘 ${{ env.LANGUAGE}} Manual build completed successfully  
                      *Artifacts*: ${ARTIFACT_URL}"
                  else
                      MSG="⚠️ ${{ env.LANGUAGE}} Manual build failed
                      *Check logs*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  fi

                  curl -X POST -H 'Content-type: application/json' \
                    --data "{\"text\":\"$MSG\"}" \
                    "$SLACK_WEBHOOK_URL"               
    
